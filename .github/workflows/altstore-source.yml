name: AltStore source

# Keeps altstore.json in step with the newest release, so a phone that has this
# source added sees the update on its own - no cable, no PC, no Actions login.
#
# Separate from ios.yml on purpose: this is a 20-second Linux job reacting to a
# release, not part of building one.

# NOT triggered by `release: published`. GitHub deliberately refuses to start a
# workflow from an event raised by GITHUB_TOKEN (its loop guard), and our
# releases are created by ios.yml using exactly that token - so a release
# trigger here would simply never fire. ios.yml calls this instead, and
# workflow_dispatch stays available for repairing a manifest by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time. Two tagged releases in quick succession would otherwise
# race, and the loser could publish the older manifest last.
concurrency:
  group: altstore-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # this job commits to main, not to the tag
          # The generator reads each release's app.json via `git show <tag>:` to
          # learn the version and build number that release actually ships, so
          # it needs the tags and their history - the default depth-1 clone has
          # neither and every release would be skipped.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The manifest carries the FULL version history (see the script's header:
      # AltStore resolves the installed build against it, so a latest-only list
      # breaks every Update), and the releases API is the authoritative record
      # of what exists - tags, dates and asset sizes together, in one call.
      - name: Fetch the release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases --paginate > releases.json
          echo "releases with an .ipa:"
          node -e '
            const r = require("./releases.json");
            for (const x of r) {
              const a = (x.assets||[]).find(a=>a.name==="TyraXMocap.ipa");
              console.log("  " + x.tag_name + (a ? "  " + a.size + "B" : "  (no ipa)"));
            }'

      - name: Regenerate altstore.json
        run: |
          set -euo pipefail
          node scripts/altstore-source.mjs releases.json
          node -e 'JSON.parse(require("fs").readFileSync("altstore.json"))'  # valid JSON
          cat altstore.json

      - name: Commit it
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore.json; then
            echo "altstore.json already current - nothing to do"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add altstore.json
          # ios.yml ignores altstore.json, so this cannot loop - the skip marker
          # is belt and braces.
          git commit -m "AltStore source: $(node -e 'console.log(require("./altstore.json").apps[0].version)') [skip ci]"
          git push

      # A green build used to mean "the manifest was pushed", which is not the
      # same thing as "a phone can install from it". Between the two sit a CDN
      # that caches this file for five minutes and release assets that have to
      # be reachable at exactly the size the manifest promises. When either is
      # not ready, AltStore reports the singularly unhelpful "The data couldn't
      # be read because it isn't in the correct format" - so check, rather than
      # hope, and let CI be the one that waits.
      - name: Check every advertised download against the real asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases --paginate > releases.json
          node scripts/check-source.mjs altstore.json releases.json

      # What AltStore actually reads. The file stays in the repo as the record
      # of what was published, but the URL a phone points at is this one.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp altstore.json site/altstore.json
          cp assets/icon.png site/icon.png
          # A landing page, because a bare JSON file is a confusing thing to
          # open in a browser and this URL will be pasted into one.
          node -e '
            const a = require("./altstore.json").apps[0];
            const rows = a.versions.map(v =>
              `<li><b>${v.version}</b> (build ${v.buildVersion}) — ${new Date(v.date).toISOString().slice(0,10)}</li>`).join("");
            require("fs").writeFileSync("site/index.html", `<!doctype html>
            <meta charset="utf-8"><title>TyraX Mocap — AltStore source</title>
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:38rem;margin:3rem auto;padding:0 1rem;color:#222}
            code{background:#f2f2f4;padding:.15em .4em;border-radius:.3em;word-break:break-all}</style>
            <h1>TyraX Mocap</h1>
            <p>${a.subtitle}. Add this URL as a source in AltStore:</p>
            <p><code>https://doctorspider42.github.io/tyrax-mocap/altstore.json</code></p>
            <h2>Releases</h2><ul>${rows}</ul>
            <p><a href="https://github.com/doctorspider42/tyrax-mocap">Source code and instructions</a></p>`);'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    # REPO SETTING, not code: the `github-pages` environment is created with a
    # deployment branch policy of `main` only. This job runs from the TAG that
    # published the release, so without a `v*` TAG policy beside it the job is
    # refused at setup - it fails in two seconds having run no steps, which
    # looks like nothing at all in the UI. Settings > Environments >
    # github-pages > Deployment branches: main AND the tag pattern v*.
    #
    # Worth knowing why it was missed: the deploy was first proved with
    # workflow_dispatch, which runs from main - the one trigger that is not the
    # real path.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Same rule as before, one layer out: green must mean a phone can install
      # from it, so wait until the page really carries this version.
      - name: Wait until Pages serves it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want=$(gh api repos/${{ github.repository }}/contents/altstore.json                  --jq '.content' | base64 -d | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).apps[0].version))')
          url="https://doctorspider42.github.io/tyrax-mocap/altstore.json"
          for attempt in $(seq 1 30); do
            curl -fsSL -H 'Cache-Control: no-cache' "$url" -o served.json || true
            got=$(node -e 'try{console.log(require("./served.json").apps[0].version)}catch(e){console.log("unreadable")}')
            echo "attempt $attempt: Pages serves $got, want $want"
            if [ "$got" = "$want" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Pages never served $want"
          exit 1
